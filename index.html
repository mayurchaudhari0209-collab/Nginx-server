<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nginx Server visual | #Buildwithmayur</title>
<meta name="description" content="Animated beginner guide: how NGINX on AWS EC2 serves a Netflix-style landing page.">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="assets/favicon.svg" width="30" height="30" alt=""><div><b>Nginx Server visual</b><small>How NGINX on AWS EC2 serves a website</small></div></div>
  <div class="ctl">
    <button id="play" aria-label="Pause or play">⏸ Pause</button>
    <button id="reset" aria-label="Reset">↺ Reset</button>
    <button id="theme" aria-label="Toggle theme">◐ Theme</button>
  </div>
</header>
<div class="app">
  <nav id="steps" aria-label="Steps"></nav>
  <main>
    <section class="card"><div class="bar"><i id="prog"></i></div>
<svg id="diagram" viewBox="0 0 900 380" role="img" aria-label="Request path from browser to NGINX on EC2">
<defs><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="340" y="12" width="550" height="356" rx="14" class="region"/>
<text x="355" y="34" class="lbl">AWS Region · VPC · Public subnet</text>
<text x="720" y="110" class="mini">Public IPv4</text><text x="720" y="130" class="ip">203.0.113.25</text>
<text x="720" y="170" class="mini">Route table</text><text x="720" y="190" class="mini">0.0.0.0/0 → IGW</text>

<g id="n-browser" data-min="0"><rect x="14" y="140" width="126" height="110" rx="10" class="node"/><rect x="26" y="152" width="102" height="62" rx="4" class="screen"/><text x="77" y="188" class="mini" text-anchor="middle">http://IP</text><text x="77" y="238" class="lbl" text-anchor="middle">Visitor</text></g>
<g id="n-net" data-min="0"><ellipse cx="255" cy="195" rx="68" ry="42" class="node"/><text x="255" y="199" class="lbl" text-anchor="middle">Internet</text></g>
<g id="n-igw" data-min="1"><rect x="330" y="168" width="52" height="54" rx="8" class="node"/><text x="356" y="192" class="lbl" text-anchor="middle">IGW</text><text x="356" y="208" class="mini" text-anchor="middle">gateway</text></g>
<g id="n-sg" data-min="2"><rect x="400" y="52" width="300" height="300" rx="12" class="sg"/><text x="412" y="72" class="warn">Security Group · allow 80 + 22</text></g>
<g id="n-gate" data-min="2"><rect x="392" y="150" width="16" height="80" rx="4" class="gate"/><text x="400" y="250" class="warn" text-anchor="middle">🛡 :80</text></g>
<g id="n-ec2" data-min="1"><rect x="420" y="86" width="260" height="248" rx="10" class="node"/><text x="432" y="106" class="lbl">EC2 · Amazon Linux 2023</text></g>
<g id="n-ssh" data-min="3"><rect x="440" y="270" width="100" height="26" rx="6" class="pill"/><text x="490" y="287" class="mini" text-anchor="middle">sshd :22</text></g>
<g id="n-nginx" data-min="4"><rect x="440" y="130" width="100" height="76" rx="8" class="ng"/><text x="490" y="164" class="lbl" text-anchor="middle">NGINX</text><text x="490" y="184" class="mini" text-anchor="middle">port 80</text><rect id="inst" x="448" y="194" width="0" height="5" rx="2" fill="#46d369"/></g>
<g id="n-status" data-min="5"><circle cx="454" cy="233" r="6" fill="#46d369"/><text x="466" y="237" class="mini">active (running)</text></g>
<g id="n-files" data-min="6"><rect x="560" y="126" width="108" height="190" rx="8" class="node"/><text x="614" y="146" class="mini" text-anchor="middle">/usr/share/nginx/html</text>
<text x="574" y="176" class="file">📄 index.html</text><text x="574" y="204" class="file">🎨 css/style.css</text><text x="574" y="232" class="file">⚙ js/app.js</text><text x="574" y="260" class="file">🖼 assets/hero.svg</text></g>
<g id="n-checks" data-min="9"><circle cx="400" cy="130" r="11" class="ok"/><text x="400" y="134" class="chk" text-anchor="middle">1</text><circle cx="700" cy="52" r="11" class="ok"/><text x="700" y="56" class="chk" text-anchor="middle">2</text><circle cx="540" cy="233" r="11" class="ok"/><text x="540" y="237" class="chk" text-anchor="middle">3</text><circle cx="800" cy="95" r="11" class="ok"/><text x="800" y="99" class="chk" text-anchor="middle">4</text></g>
<path id="req" d="M140 180 L400 180 L440 172" class="line"/>
<path id="res" d="M440 196 L400 208 L140 208" class="line"/>
<path id="ssh" d="M140 160 L400 160 L430 285" class="line amber"/>
</svg>
    </section>
    <section class="card caption" id="caption" aria-live="polite"></section>
    <section class="card"><div class="tbar"><i></i><i></i><i></i><span id="ttl">terminal</span></div><pre id="term"></pre></section>
    <section class="card"><div class="chrome"><i></i><i></i><i></i><span id="url">http://203.0.113.25</span></div><div id="preview" class="preview"></div></section>
  </main>
</div>
<footer>#Buildwithmayur · Unofficial educational demo. Not affiliated with Netflix. All visuals are original. 203.0.113.25 is a documentation example IP.</footer>
<script src="js/app.js"></script>
</body>
</html>
